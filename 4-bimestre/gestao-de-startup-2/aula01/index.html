<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19271f">
  <title>Estuda+ | Pesquisa NPS</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202920;
      --muted: #637066;
      --paper: #19271f;
      --surface: #fbf8ec;
      --line: #d8d5c4;
      --green: #176b45;
      --green-soft: #e1efdf;
      --yellow: #9b6b00;
      --yellow-soft: #f9edc7;
      --red: #ad3e32;
      --red-soft: #f6e1d9;
      --accent: #e8bc3d;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: repeating-linear-gradient(135deg, rgb(255 255 255 / 2%) 0 2px, transparent 2px 13px);
      background-size: 19px 19px;
    }

    button, select { font: inherit; }

    .page {
      width: min(100% - 32px, 920px);
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      color: #d8dfd4;
      font-size: 0.83rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand { color: #e8bc3d; }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 6vw, 58px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 16px 42px rgb(0 0 0 / 24%);
    }

    .hero::after {
      position: absolute;
      top: 0;
      right: 0;
      width: 12px;
      height: 100%;
      background: linear-gradient(to bottom, #b83f32 0 33.33%, #e8bc3d 33.33% 66.66%, #176b45 66.66% 100%);
      content: "";
    }

    .hero-intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 168px;
      align-items: center;
      gap: 26px;
    }

    .marley-figure { margin: 0; }

    .marley-figure img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      border: 4px solid white;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 8px 18px rgb(32 41 32 / 18%);
    }

    .marley-figure figcaption {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.7rem;
      line-height: 1.4;
      text-align: center;
    }

    .marley-figure a { color: var(--green); }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 680px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      font-weight: 500;
      line-height: 1.02;
    }

    .description {
      max-width: 590px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.6;
    }

    .survey {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 18px;
      margin-top: 38px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      line-height: 1.45;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select {
      width: 112px;
      min-height: 48px;
      padding: 0 12px;
      border: 1px solid #aebbb3;
      border-radius: 5px;
      color: var(--ink);
      background: white;
    }

    .scale-hint { color: var(--muted); font-size: 0.88rem; }

    .primary-button, .clear-button {
      min-height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 5px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-button { color: white; background: var(--green); }
    .primary-button:hover { background: #105238; }
    button:focus-visible, select:focus-visible { outline: 3px solid #d49d12; outline-offset: 3px; }

    .results { margin-top: 34px; }

    .results-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    h2 { margin: 0; font-size: 1.15rem; }
    .total { color: var(--muted); font-size: 0.9rem; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-height: 108px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .metric-label { display: block; color: var(--muted); font-size: 0.83rem; font-weight: 700; }
    .metric-value { display: block; margin-top: 9px; font-size: 2rem; font-weight: 800; line-height: 1; }
    .metric.promoters { border-color: #b8d3b8; background: var(--green-soft); }
    .metric.neutrals { border-color: #e6d49b; background: var(--yellow-soft); }
    .metric.detractors { border-color: #e5bdb0; background: var(--red-soft); }
    .metric.promoters .metric-value { color: var(--green); }
    .metric.neutrals .metric-value { color: var(--yellow); }
    .metric.detractors .metric-value { color: var(--red); }
    .metric.nps { color: #fffdf4; border-color: #176b45; background: #176b45; }
    .metric.nps .metric-label { color: #e1efdf; }

    .result-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
    }

    .status { min-height: 1.4em; margin: 0; color: var(--muted); font-size: 0.9rem; }
    .clear-button { min-height: 38px; padding: 0 12px; color: #ffd2c3; background: transparent; }
    .clear-button:hover { background: var(--red-soft); }

    @media (max-width: 620px) {
      .page { width: min(100% - 24px, 920px); padding-top: 22px; }
      .topline { margin-bottom: 18px; }
      .hero-intro { grid-template-columns: minmax(0, 1fr) 96px; gap: 14px; }
      h1 { font-size: clamp(1.7rem, 8vw, 2.4rem); }
      .survey { grid-template-columns: 1fr; }
      .primary-button { width: 100%; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric { min-height: 94px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero, .metric { animation: arrive 420ms ease-out both; }
      .metric:nth-child(2) { animation-delay: 50ms; }
      .metric:nth-child(3) { animation-delay: 100ms; }
      .metric:nth-child(4) { animation-delay: 150ms; }
      @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline">
      <span class="brand">Estuda+</span>
      <span>Pesquisa de recomendação</span>
    </div>

    <section class="hero" aria-labelledby="app-title">
      <div class="hero-intro">
        <div>
          <p class="eyebrow">Seu ritmo, seus estudos</p>
          <h1 id="app-title">Estuda+</h1>
          <p class="description">O Estuda+ organiza suas tarefas e ajuda você a manter o ritmo dos estudos.</p>
        </div>
        <figure class="marley-figure">
          <img src="bob-marley.jpg" alt="Bob Marley cantando e tocando guitarra em um show ao vivo">
          <figcaption>
            Foto: <a href="https://commons.wikimedia.org/wiki/File:Bob-Marley.jpg" target="_blank" rel="noopener noreferrer">Eddie Mallin</a>
            · <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener noreferrer">CC BY 2.0</a>
          </figcaption>
        </figure>
      </div>

      <form class="survey" id="survey-form">
        <div>
          <label for="rating">De 0 a 10, quanto você recomendaria este app para um amigo?</label>
          <div class="input-row">
            <select id="rating" name="rating" required>
              <option value="">Nota</option>
            </select>
            <span class="scale-hint">0 = nada provável · 10 = muito provável</span>
          </div>
        </div>
        <button class="primary-button" type="submit">Registrar resposta</button>
      </form>
    </section>

    <section class="results" aria-labelledby="results-title">
      <div class="results-heading">
        <h2 id="results-title">Resultado da pesquisa</h2>
        <span class="total" id="total-responses">0 respostas</span>
      </div>
      <div class="metrics" aria-live="polite">
        <div class="metric promoters">
          <span class="metric-label">Promotores · 9 a 10</span>
          <strong class="metric-value" id="promoters-count">0</strong>
        </div>
        <div class="metric neutrals">
          <span class="metric-label">Neutros · 7 a 8</span>
          <strong class="metric-value" id="neutrals-count">0</strong>
        </div>
        <div class="metric detractors">
          <span class="metric-label">Detratores · 0 a 6</span>
          <strong class="metric-value" id="detractors-count">0</strong>
        </div>
        <div class="metric nps">
          <span class="metric-label">NPS</span>
          <strong class="metric-value" id="nps-score">—</strong>
        </div>
      </div>
      <div class="result-footer">
        <p class="status" id="status-message" role="status"></p>
        <button class="clear-button" id="clear-button" type="button">Limpar respostas</button>
      </div>
    </section>
  </main>

  <script>
    const storageKey = "estuda-plus-nps-respostas";
    const ratingSelect = document.querySelector("#rating");
    const surveyForm = document.querySelector("#survey-form");
    const statusMessage = document.querySelector("#status-message");

    for (let rating = 0; rating <= 10; rating += 1) {
      const option = document.createElement("option");
      option.value = String(rating);
      option.textContent = String(rating);
      ratingSelect.append(option);
    }

    function loadResponses() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(saved)
          ? saved.filter((rating) => Number.isInteger(rating) && rating >= 0 && rating <= 10)
          : [];
      } catch {
        return [];
      }
    }

    function updateResults(responses) {
      const promoters = responses.filter((rating) => rating >= 9).length;
      const neutrals = responses.filter((rating) => rating >= 7 && rating <= 8).length;
      const detractors = responses.filter((rating) => rating <= 6).length;
      const total = responses.length;

      document.querySelector("#promoters-count").textContent = String(promoters);
      document.querySelector("#neutrals-count").textContent = String(neutrals);
      document.querySelector("#detractors-count").textContent = String(detractors);
      document.querySelector("#total-responses").textContent = `${total} ${total === 1 ? "resposta" : "respostas"}`;
      document.querySelector("#nps-score").textContent = total
        ? String(Math.round(((promoters - detractors) / total) * 100))
        : "—";
    }

    let responses = loadResponses();
    updateResults(responses);

    surveyForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const rating = Number(ratingSelect.value);
      if (ratingSelect.value === "" || !Number.isInteger(rating) || rating < 0 || rating > 10) return;

      responses.push(rating);
      try {
        localStorage.setItem(storageKey, JSON.stringify(responses));
        updateResults(responses);
        statusMessage.textContent = "Resposta registrada.";
        surveyForm.reset();
      } catch {
        responses.pop();
        statusMessage.textContent = "Não foi possível salvar. Verifique as permissões de armazenamento do navegador.";
      }
    });

    document.querySelector("#clear-button").addEventListener("click", () => {
      if (!window.confirm("Apagar todas as respostas salvas neste navegador?")) return;
      try {
        localStorage.removeItem(storageKey);
        responses = [];
        updateResults(responses);
        statusMessage.textContent = "Respostas apagadas.";
      } catch {
        statusMessage.textContent = "Não foi possível apagar as respostas salvas.";
      }
    });
  </script>
</body>
</html>
