info:
  name: Criar tarefas
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/tarefas
  body:
    type: json
    data: |-
      {
        "titulo": "Nova tarefa",
        "feita": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
